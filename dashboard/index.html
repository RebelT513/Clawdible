<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clawdible — CFB Track Record</title>
  <link rel="stylesheet" href="style.css?v=20260905172543">
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="logo">Clawdible <span class="tag">CFB</span></div>
      <div id="last-updated" class="muted">—</div>
    </div>
  </header>

  <main>
    <!-- Top stat strip -->
    <div class="stat-strip">
      <div class="stat-card">
        <div class="stat-label">Picks Made</div>
        <div class="stat-value" id="flags-made">—</div>
      </div>
      <div class="stat-card stat-card--lead">
        <div class="stat-label">Record</div>
        <div class="stat-value" id="flag-record">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Units +/-</div>
        <div class="stat-value" id="units-pnl">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Pending</div>
        <div class="stat-value" id="pending-count">—</div>
      </div>
    </div>

    <!-- Picks table -->
    <div class="card">
      <div class="card-title">Picks</div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Game</th>
              <th>Market</th>
              <th>Pick</th>
              <th>Line</th>
              <th>p</th>
              <th>Units</th>
              <th>Result</th>
            </tr>
          </thead>
          <tbody id="flags-table-body">
            <tr><td colspan="8" class="empty-row">No picks yet.</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <footer>
    <div class="footer-inner">
      Paper record for evaluation purposes only. Not investment or betting
      advice. Lines shown are public consensus, not a live sportsbook board.
    </div>
  </footer>

  <script src="app.js?v=20260905172543"></script>
</body>
</html>
